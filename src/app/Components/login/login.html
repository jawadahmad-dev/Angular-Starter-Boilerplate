<div
  class="relative w-screen h-screen flex items-center justify-center bg-[#0b0f1a] overflow-hidden"
>
  <!-- Background Effects -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <div
      class="absolute inset-0 bg-gradient-to-br from-indigo-600/10 via-purple-600/10 to-cyan-600/10"
    ></div>
    <div
      class="absolute -top-40 -left-40 w-[32rem] h-[32rem] bg-indigo-500/20 rounded-full blur-3xl animate-pulse"
    ></div>
    <div
      class="absolute -bottom-40 -right-40 w-[32rem] h-[32rem] bg-cyan-500/20 rounded-full blur-3xl animate-pulse"
    ></div>
    <!-- Optional: Subtle grid pattern for extra modern feel -->
    <div
      class="absolute inset-0 bg-[url('data:image/svg+xml,%3Csvg%20width%3D%2240%22%20height%3D%2240%22%20viewBox%3D%220%200%2040%2040%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cg%20fill%3D%22%23ffffff%22%20fill-opacity%3D%220.03%22%20fill-rule%3D%22evenodd%22%3E%3Cpath%20d%3D%22M0%2040L40%200H20L0%2020M40%2040V20L20%2040%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E')] opacity-30"
    ></div>
  </div>

  <!-- Main Centered Div (Width Increased to max-w-md / lg) -->
  <div class="relative w-full max-w-md sm:max-w-lg px-4 z-10">
    <!-- Glassmorphism Card -->
    <div
      class="rounded-3xl bg-white/5 backdrop-blur-2xl border border-white/10 p-8 sm:p-10 shadow-2xl shadow-black/40"
    >
      <!-- Header -->
      <div class="flex flex-col items-center mb-8">
        <h2 class="text-3xl font-bold text-white tracking-tight">Welcome back</h2>
        <p class="text-gray-400 text-sm mt-2">Sign in to continue to your account</p>
      </div>

      <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <!-- Email -->
        <div class="flex flex-col gap-1.5">
          <label for="email" class="text-xs font-semibold text-gray-400 tracking-wide uppercase"
            >Email address</label
          >
          <p-iconfield class="w-full">
            <p-inputicon class="pi pi-envelope !text-indigo-400" />
            <input
              pInputText
              id="email"
              type="email"
              formControlName="email"
              placeholder="john@example.com"
              class="w-full !bg-white/5 !border-white/10 !text-gray-100 placeholder:!text-gray-500 rounded-xl focus:!border-indigo-500 focus:!ring-1 focus:!ring-indigo-500/50 transition-all duration-200"
            />
          </p-iconfield>
        </div>

        <!-- Password -->
        <div class="flex flex-col gap-1.5">
          <div class="flex items-center justify-between">
            <label
              for="password"
              class="text-xs font-semibold text-gray-400 tracking-wide uppercase"
              >Password</label
            >
          </div>
          <p-iconfield class="w-full">
            <p-inputicon class="pi pi-lock !text-indigo-400" />
            <p-password
              formControlName="password"
              inputId="password"
              placeholder="Enter your password"
              [toggleMask]="true"
              [feedback]="false"
              styleClass="w-full"
              inputStyleClass="w-full !bg-white/5 !border-white/10 !text-gray-100 placeholder:!text-gray-500 rounded-xl 
                               focus:!border-indigo-500 focus:!ring-1 focus:!ring-indigo-500/50 transition-all duration-200"
            />
          </p-iconfield>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full cursor-pointer py-3 px-5 mt-2 bg-indigo-600 hover:bg-indigo-500 disabled:bg-indigo-600/50 disabled:cursor-not-allowed text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/25 border border-transparent hover:border-indigo-400/50 transition-all duration-200 hover:-translate-y-0.5 flex items-center justify-center gap-2"
        >
          <span>Sign in</span>

          <i class="pi pi-arrow-right text-sm"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- @if(sharedService.$obsloading | async) {
    <div class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/40 backdrop-blur-sm">
   <app-loader></app-loader>
    </div>
  } -->
</div>
